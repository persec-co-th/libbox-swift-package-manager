name: Publish Release on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    # รันเฉพาะเมื่อ PR ถูก merge จริง และมาจาก branch release/ เท่านั้น
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Release Version
        id: meta
        run: |
          REF="${{ github.event.pull_request.head.ref }}"
          VERSION="${REF#release/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # ปรับ draft release ให้เป็น public และให้ tag ชี้มาที่ commit merge บน main
          gh release edit "$VERSION" --draft=false --target "${{ github.sha }}"