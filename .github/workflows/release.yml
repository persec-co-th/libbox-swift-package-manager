name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      sing_box_tag:
        description: "sing-box source tag to build (e.g. v1.12.25)"
        required: true
        type: string
      release_version:
        description: "release version for this repo (e.g. 1.12.25)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ inputs.sing_box_tag }}
          path: sing-box

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: Install gomobile
        working-directory: sing-box
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Libbox.xcframework
        working-directory: sing-box
        run: |
          gomobile init
          gomobile bind -v \
            -target ios,macos \
            -libname=box \
            -tags-not-macos=with_low_memory \
            -trimpath \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ inputs.sing_box_tag }} -s -w -buildid=" \
            -tags with_gvisor,with_utls,with_quic,with_clash_api \
            ./experimental/libbox
          zip -ry Libbox.xcframework.zip Libbox.xcframework

      - name: Report size
        working-directory: sing-box
        run: |
          echo "### Libbox ${{ inputs.release_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh Libbox.xcframework.zip >> "$GITHUB_STEP_SUMMARY"
          find Libbox.xcframework -name "Libbox" -type f -exec du -sh {} \; >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create Draft Release & Upload Binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SING_BOX_TAG: ${{ inputs.sing_box_tag }}
        run: |
          # ลบ draft เดิม (ถ้ามี) เพื่อให้ re-run ด้วย version เดิมได้
          if gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$RELEASE_VERSION" --yes
          fi
          gh release create "$RELEASE_VERSION" \
            sing-box/Libbox.xcframework.zip \
            --draft \
            --title "Libbox $RELEASE_VERSION" \
            --notes "Built from SagerNet/sing-box $SING_BOX_TAG — tags: with_gvisor, with_utls, with_quic, with_clash_api, with_low_memory (ios only) · slices: ios, ios-simulator, macos"

      - name: Update Package.swift file
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SING_BOX_TAG: ${{ inputs.sing_box_tag }}
        run: |
          CHECKSUM=$(shasum -a 256 sing-box/Libbox.xcframework.zip | awk '{print $1}')
          URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_VERSION}/Libbox.xcframework.zip"
          sed -e "s|__URL__|$URL|" \
              -e "s|__CHECKSUM__|$CHECKSUM|" \
              -e "s|__SOURCE__|SagerNet/sing-box $SING_BOX_TAG|" \
              Package.swift.tmpl > Package.swift

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Release ${{ inputs.release_version }} (sing-box ${{ inputs.sing_box_tag }})"
          title: "Release: Libbox ${{ inputs.release_version }}"
          body: |
            Automated PR for release `${{ inputs.release_version }}` (sing-box `${{ inputs.sing_box_tag }}`).

            - Framework built and uploaded to Draft Release.
            - `Package.swift` updated with checksum and release asset URL.
            - Once merged, the draft release will be published and Git tag created automatically.
          add-paths: Package.swift
          branch: "release/${{ inputs.release_version }}"
          base: main
          delete-branch: true
